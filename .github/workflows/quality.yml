name: Qualidade

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validar-markdown:
    name: Validar Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Validar formato de texto e Markdown
        run: npm run check

      - name: Auditar segurança das skills
        run: npm run check:skill-security
        continue-on-error: true

      - name: Consultar Trust Hub da skill readme
        continue-on-error: true
        shell: bash
        run: |
          set +e
          endpoint="https://skills.sh/api/v1/skills/audit/ileonardo-c/skills/readme"
          response="$(curl --silent --show-error --location --write-out '\n%{http_code}' "$endpoint")"
          status="$(printf '%s' "$response" | tail -n 1)"
          body="$(printf '%s' "$response" | sed '$d')"

          echo "skills.sh audit HTTP status: $status"

          if command -v jq >/dev/null 2>&1 && [ -n "$body" ]; then
            echo "Gen Agent Trust Hub:"
            printf '%s' "$body" | jq -r '.genAgentTrustHub // .trustHub // .trust_hub // .'
            echo "Socket:"
            printf '%s' "$body" | jq -r '.socket // .checks.socket // .security.socket // "não informado"'
            echo "Snyk:"
            printf '%s' "$body" | jq -r '.snyk // .checks.snyk // .security.snyk // "não informado"'
          else
            echo "$body"
          fi

  validar-skill:
    name: Validar SKILL.md
    runs-on: ubuntu-latest
    strategy:
      matrix:
        skill:
          - skills/readme
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Validar ${{ matrix.skill }}
        uses: Flash-Brew-Digital/validate-skill@v1
        with:
          path: ./${{ matrix.skill }}
          validate-references: "true"
          fail-on-warning: "false"
